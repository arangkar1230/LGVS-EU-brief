<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU 데일리 브리프 — 2026-11-01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --paper:#FBFBF9; --surface:#FFFFFF; --ink:#16213A; --ink-2:#3A4458; --muted:#5A6475; --line:#E4E6EB;
  --wine:#A50034; --wine-ink:#7E0028; --wine-tint:#F6E8ED; --on-wine:#FFFFFF;
  --risk:#B3261E; --risk-bg:#FBEAE8; --ops:#8A5A00; --ops-bg:#FBF1DE; --mix:#3D4F6B; --mix-bg:#E8EDF4; --opp:#1F6B4A; --opp-bg:#E3F2EA;
  --serif:"Noto Serif KR", serif; --sans:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#10141D;--surface:#171C27;--ink:#EEF0F4;--ink-2:#C9CED8;--muted:#98A1B2;--line:#283041;
  --wine:#E0507A;--wine-ink:#F28AA8;--wine-tint:#2A1A22;--on-wine:#FFFFFF;
  --risk:#FF8A80;--risk-bg:#3A1F1E;--ops:#F2C066;--ops-bg:#33290F;--mix:#A9BCD9;--mix-bg:#1F2838;--opp:#7FD6A9;--opp-bg:#15302A}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.bar strong{color:var(--ink);font-weight:600}
.bar strong span{color:var(--wine)}
.bar select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* hero */
.hero{padding:48px 0 36px}
.hero .day{font-size:15px;color:var(--muted);margin:0 0 6px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,48px);line-height:1.2;letter-spacing:-.01em;margin:0 0 22px}
.hero .lead{font-family:var(--serif);font-weight:500;font-size:clamp(19px,3.4vw,22px);line-height:1.7;color:var(--ink-2);margin:0;padding-left:18px;border-left:3px solid var(--wine)}

/* today checklist — the one loud element */
.today{background:var(--wine);color:var(--on-wine);border-radius:18px;padding:28px 28px 22px;margin:8px 0 56px}
.today h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 4px}
.today .sub{font-size:14px;opacity:.85;margin:0 0 16px}
.today ul{list-style:none;margin:0;padding:0}
.today li{border-top:1px solid rgba(255,255,255,.22)}
.today label{display:flex;gap:14px;align-items:flex-start;padding:13px 0;cursor:pointer;font-size:17px;font-weight:500;line-height:1.6}
.today input{appearance:none;flex:none;width:22px;height:22px;margin-top:2px;border:2px solid rgba(255,255,255,.8);border-radius:6px;cursor:pointer;display:grid;place-content:center}
.today input:checked{background:#fff}
.today input:checked::after{content:"";width:10px;height:6px;border:solid var(--wine);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.today input:checked + span{text-decoration:line-through;opacity:.6}
.today .count{font-size:13px;opacity:.85;margin-top:10px}

/* overview */
.overview{margin:0 0 56px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 18px}
.sec-h h2{white-space:nowrap}
.sec-h h2{font-family:var(--serif);font-size:24px;font-weight:700;margin:0}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.ov{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ov li{border-bottom:1px solid var(--line)}
.ov a{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px 0;text-decoration:none;align-items:baseline}
.ov a:hover .t{color:var(--wine)}
.ov .k{font-size:13px;font-weight:600;color:var(--muted)}
.ov .k.top{color:var(--wine)}
.ov .t{font-weight:600;font-size:16.5px;line-height:1.55}

/* issue */
.group{margin:0 0 40px}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 28px;margin:0 0 20px}
.group.top .issue{box-shadow:inset 0 4px 0 var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{font-size:13px;font-weight:600;line-height:1;padding:7px 10px;border-radius:999px;white-space:nowrap;background:var(--mix-bg);color:var(--mix)}
.tag.cat{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.d-risk{background:var(--risk-bg);color:var(--risk)} .d-ops{background:var(--ops-bg);color:var(--ops)}
.d-mix{background:var(--mix-bg);color:var(--mix)} .d-opp{background:var(--opp-bg);color:var(--opp)}
.issue h3{font-family:var(--serif);font-weight:700;font-size:clamp(21px,4vw,25px);line-height:1.45;margin:0 0 12px;letter-spacing:-.005em}
.issue .sum{color:var(--ink-2);margin:0 0 24px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 16px}
.pane{border-radius:12px;padding:18px 18px 16px}
.pane h4{margin:0 0 8px;font-size:14px;font-weight:700}
.hyp{background:var(--mix-bg)} .hyp h4{color:var(--mix)}
.act{background:var(--wine-tint)} .act h4{color:var(--wine-ink)}
.pane p,.pane ul{margin:0;font-size:15.5px;line-height:1.7}
.pane ul{padding-left:18px}.pane li+li{margin-top:6px}
.prods{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 0}
.prods span{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

.caveat{display:flex;gap:10px;font-size:15px;color:var(--ink-2);padding:12px 14px;border:1px dashed var(--line);border-radius:10px;margin:0 0 16px}
.caveat b{flex:none;color:var(--ops);font-weight:700}

.ask{border-left:3px solid var(--wine);padding:4px 0 4px 16px;margin:0 0 18px}
.ask .lbl{font-size:13px;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ask q{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:17px;line-height:1.6;quotes:none}
.copy{font:inherit;font-size:13px;font-weight:600;color:var(--wine-ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer}
.copy:hover{border-color:var(--wine)}

details.src{font-size:14px;color:var(--muted)}
details.src summary{cursor:pointer;width:max-content}
details.src ul{margin:8px 0 0;padding-left:18px}
details.src a{color:var(--ink-2)}

/* status + footer */
.status{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:48px}
.status .s-ok{color:var(--opp)} .status .s-bad{color:var(--risk)} .status .s-part{color:var(--ops)}
footer{font-size:13.5px;color:var(--muted);margin-top:14px;line-height:1.7}

@media (max-width:640px){
  .wrap{padding:0 16px 64px}
  .hero{padding:36px 0 28px}
  .today{padding:22px 20px 16px;border-radius:14px}
  .issue{padding:24px 18px}
  .duo{grid-template-columns:1fr}
  .ov a{grid-template-columns:64px 1fr;gap:10px}
  .sec-h p{flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){
  .today{animation:rise .5s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>

ing power grab (10/31)", "url": "https://www.euronews.com/2026/10/31/poland-political-crisis-constitutional-court-in-chaos-as-nawrocki-accuses-government-of-st"}, {"title": "Euronews — Poland crisis: Donald Tusk strikes defiant tone vowing 'no compromise' on rule of law after Tribunal clash (10/31)", "url": "https://www.euronews.com/2026/10/31/poland-crisis-donald-tusk-strikes-defiant-tone-vowing-no-compromise-on-rule-of-law-after-t"}], "hypothesis": {"products": ["폴란드 소재 OEM·Tier-1 공장 향 납품 (인포테인먼트·ADAS 카메라·램프)", "즐로티 표시 거래·현지 법인 운영 (환율)", "폴란드 경유 중동유럽 육상 물류"], "direction": "운영 리스크", "text": "헌정 갈등이 장기화하면 폴란드 내 공공 의사결정(보조금·인허가·EU 기금 집행)이 늦어지고 즐로티 변동성이 커질 수 있어, 폴란드 생산 거점을 둔 고객의 투자·증설 일정이나 현지 조달 결정이 보수적으로 바뀔 가능성. 다만 지금까지는 정치·법적 충돌에 머물러 있어 공장 가동이나 물류에 직접 영향이 있다는 신호는 없음."}, "caveat": "기사에는 EU 집행위 반응, 금융시장·즐로티 반응, 경제 영향이 나오지 않았음. 갈등이 거리 시위나 행정 마비로 번질지, 해결 협상이 열릴지도 확인되지 않았음. VS 고객사의 폴란드 사업에 미치는 영향은 현재로선 추정일 뿐임.", "actions": ["폴란드 공장을 둔 고객 바이어에게 정치 상황으로 인한 투자·증설·SOP 일정 변경 논의가 있는지 확인", "재무팀과 즐로티 표시 거래·현지 비용의 환율 노출 규모 점검", "폴란드 경유 운송 포워더에 시위·통행 제한 등 운송 차질 징후가 있는지 확인"], "buyer_question": "Is the current political situation in Poland affecting any investment, ramp-up or SOP timing at your Polish plants that we should take into account?"}, {"id": "france-europe-youth-protests-weekend3", "section": "top", "category": "사회/시위", "title": "프랑스 세 번째 주말 시위 약 32만 명으로 감소 — 리옹 최루탄·파리 지하철역 40여 곳 폐쇄, 독일·이탈리아·스페인 등 유럽 청년 시위 계속", "summary": "10/31 프랑스 전역 시위 참가자는 내무부 추산 약 32만 명(파리 7만 명)으로 10/24(41만 명)·10/17(55만 명)보다 줄었음. 리옹에서는 트램·지하철이 절반만 운행했고 행진 중 경찰이 최루탄을 사용함. 파리에서는 지하철역 40곳 이상이 닫혔고, 레퓌블리크 광장·레알 일대는 밤 11시~오전 6시 출입이 통제됐으며 샹젤리제 일대에는 보호자 없는 미성년자 야간 통행금지가 주말 동안 적용됨. 오후 2시 기준 체포는 27명으로 지난주 같은 시각(217명)보다 크게 적었지만, 당국은 할로윈 밤을 틈탄 소요를 경계함. 학교 시설 노후·교사 부족·불공정한 대입 제도에 대한 고교생 항의로 시작된 운동에 노조 등이 합류했고, 독일('Gen Z regelt'), 네덜란드, 이탈리아(밀라노·토리노·볼로냐), 스페인(바르셀로나 최고 경계)에서도 시위 호출이 이어짐.", "sources": [{"title": "Euronews — France's third weekend of social protests sees lower turnout and early clashes in major cities (10/31)", "url": "https://www.euronews.com/2026/10/31/frances-third-weekend-of-social-protests-sees-lower-turnout-and-early-clashes-in-major-cit"}], "hypothesis": {"products": ["프랑스·이탈리아·스페인 OEM 향 납품 (도심 통제·대중교통 차질)", "유럽 소비 심리 연동 신차 수요"], "direction": "혼재", "text": "참가 인원과 체포가 줄어든 점은 소요가 정점을 지나고 있을 가능성을 보여 주지만, 시위가 여러 나라로 퍼진 상태에서 노조 파업과 결합하면 도심 교통 통제·공장 출근 차질이 간헐적으로 이어질 수 있음. 생활비 불만이 계속되면 소비 심리를 눌러 신차 구매 시점이 늦춰질 가능성도 있음."}, "caveat": "이번 기사에는 도로·항만·철도 화물 차질이 보고되지 않았음. 추가 시위·파업 일정은 기사에 나오지 않았고, 시위가 자동차 판매나 공장 가동에 영향을 줬다는 근거도 없음.", "actions": ["프랑스·스페인·이탈리아 고객 바이어에게 시위·대중교통 차질로 인한 공장 근무·입고 차질 여부 확인", "포워더에 주말·야간 도심 통제가 납품 시간대(특히 JIT/JIS 납품)에 영향을 주는지 확인"], "buyer_question": "Have the ongoing protests and public transport disruptions affected shift attendance or inbound receiving at any of your plants, and should we plan buffer stock for the coming weeks?"}, {"id": "eu-supplier-diversification-tool", "section": "vs", "category": "공급망/통상", "title": "EU, 12월 초 '단일 공급국 의존 축소' 도구 발표 예정 — 사실상 중국 겨냥, 기업들은 공급선 다변화 비용 상승 우려", "summary": "EU 집행위가 12월 정상회의 약 1주 전에 특정 국가 한 곳에 대한 전략적 의존도가 높은 경우 기업에 공급선 다변화를 압박하는 새 도구를 내놓을 예정임. 중국을 명시하진 않았지만 사실상 중국을 겨냥한 것으로 보도됨. 2025년 중국의 희토류 수출 차단과 넥스페리아 분쟁에 따른 차량용 칩 공급 차질이 배경으로 거론됨. 적용 업종과 기준은 아직 공개되지 않았음. ECFR 연구원은 소수 업종에 다변화 의무를 거는 '최소안'과 단일 공급원 비중이 기준을 넘는 구매 기업에 관세를 매기는 '최대안' 두 시나리오를 제시함. 비즈니스유럽은 기업이 이미 원가·성능을 따져 공급선을 고른 것이라며 모든 의존이 문제는 아니라고 반박했고, 셰프초비치 통상위원은 기업이 '회복력 비용'을 사업 모델에 반영해야 한다고 말해 왔음. 비용 추정치는 제시되지 않았음.", "sources": [{"title": "Euronews — EU's push to reduce reliance on China could come at a price (10/29)", "url": "https://www.euronews.com/2026/10/29/eus-push-to-reduce-reliance-on-china-could-come-at-a-price"}], "hypothesis": {"products": ["인포테인먼트·텔레매틱스 (반도체·전자부품 조달)", "e-파워트레인 (희토류 영구자석 모터)", "ADAS 카메라·ZKW 램프 (부품 원산지 요건)"], "direction": "혼재", "text": "도구가 자동차 공급망까지 적용되면 유럽 OEM·Tier-1이 중국 단일 의존 부품을 줄이려 비중국 공급원을 찾는 과정에서 한국계 공급사에 RFQ 기회가 늘어날 수 있음(잠재 기회). 반면 VS 제품 자체에 중국산 칩·자석·소재가 들어가 있으면 원산지 증빙 요구와 다변화 비용이 커지고, '최대안'이 채택되면 구매사가 관세 부담을 공급사에 넘기려 할 가능성도 있음."}, "caveat": "적용 업종·기준·시행 시점은 미정이며 자동차 부품이 포함될지 확인되지 않았음. 기사에는 비용 추정치가 없음. 고객사가 실제로 공급선 재검토를 시작했는지는 알 수 없음.", "actions": ["주요 OEM·Tier-1 구매팀에 단일 공급국 의존 축소를 위한 공급선 재검토·dual sourcing RFQ 계획이 있는지 확인", "내부적으로 VS 제품별 중국산 반도체·희토류 자석·소재 비중과 원산지 증빙 가능 여부 정리", "진행 중인 RFQ 조건에 원산지·공급망 실사 요구가 추가될 가능성 문의"], "buyer_question": "Ahead of the Commission's supply-diversification proposal in December, are you planning any dual-sourcing reviews or new RFQ requirements on country-of-origin for electronics or e-motor components?"}, {"id": "fitch-france-negative-outlook", "section": "vs", "category": "거시/재정", "title": "피치, 프랑스 등급 A+ 유지하되 전망 '부정적'으로 하향 — 정치 분열·사회 불안 이유, 정부는 적자 GDP 5% 이하 예산 연내 처리 목표", "summary": "피치가 10/31 프랑스 국가신용등급 A+를 유지하면서 전망을 '안정적'에서 '부정적'으로 낮춤. 8월 평가 때보다 성장이 약하고 차입 비용과 재정적자가 커졌으며, 지속되는 정치 분열과 대규모 시위 같은 '어려운 사회적 분위기'가 재정 건전화를 더 어렵게 한다고 설명함. 프랑스 GDP는 1분기 -0.2%, 2분기 정체, 3분기 -0.1%로 올해 내내 성장이 없었음. 레스퀴르 경제장관은 경제가 '멈춰 섰다'며 예산 없이는 '벽에 부딪힌다'고 경고했고, 정부는 재정적자를 GDP 5% 이하로 낮춘 2027년 예산을 연내 통과시키겠다는 입장. 하원 과반이 없어 헌법 49.3조(표결 없는 채택)나 1958년 이후 예산에 쓴 적 없는 '예산 명령' 방식이 거론되며, 대선은 약 6개월 뒤임.", "sources": [{"title": "Euronews — France pushes 'responsible' 2027 budget as Fitch cuts debt outlook to 'negative' (10/31)", "url": "https://www.euronews.com/2026/10/31/france-pushes-responsible-2027-budget-as-fitch-cuts-debt-outlook-to-negative"}], "hypothesis": {"products": ["프랑스 OEM(르노·스텔란티스) 향 인포테인먼트·ADAS 카메라·램프", "e-파워트레인 (전기차 지원책 연동 수요)"], "direction": "하방 리스크", "text": "신용 전망 하향으로 프랑스 차입 비용이 더 오르고 예산이 긴축 쪽으로 짜이면 전기차 구매 지원 같은 재정 지원이 줄거나 일정이 늦어질 수 있고, 경기 정체와 겹쳐 프랑스 시장 신차 수요와 프랑스 OEM 생산 계획이 보수적으로 바뀔 가능성. 예산이 연내 우회 방식으로라도 처리되면 단기 불확실성은 다소 줄어들 수 있음."}, "caveat": "기사에는 국채 금리 수치, 기업 세금·자동차·전기차 관련 예산 항목이 나오지 않았음. 예산이 어떤 방식으로 언제 통과될지, 다른 신평사가 뒤따를지는 확인되지 않았음.", "actions": ["프랑스 OEM 바이어에게 2027년 예산·전기차 지원 불확실성이 프로그램 물량 forecast나 SOP 일정에 반영되는지 문의", "프랑스 향 call-off 추이와 재고를 점검해 수요 둔화 시 과잉 재고 위험 확인", "프랑스 고객의 결제 조건·신용 한도 변동 여부를 재무팀과 점검"], "buyer_question": "Following Fitch's negative outlook and the 2027 budget uncertainty in France, do you expect any change to your 2027 volume forecast or EV program timing that we should plan for?"}, {"id": "eu-parcel-handling-fee", "section": "vs", "category": "통관/물류", "title": "11/1부터 EU 반입 모든 소포에 2유로 처리 수수료 — 150유로 미만 소포 3유로 관세에 추가, 91%가 중국발", "summary": "EU가 11/1부터 역내로 들어오는 모든 소포에 가격과 관계없이 2유로의 처리 수수료를 부과함. 7월부터 시행 중인 150유로 미만 소포 3유로 관세에 더해지는 것으로, 전자상거래 화물이 세관에 지우는 통제 비용을 충당하려는 목적. 수수료는 플랫폼·판매자·운송사가 내고 회원국이 징수하며 수입의 75%는 EU 예산, 25%는 회원국 몫. 집행위에 따르면 3유로 관세 도입 뒤 7~9월 소형 소포 수입이 60% 줄었지만 여전히 하루 약 500만 개가 들어오고, 2024년 기준 91%가 중국발임. 3유로 관세는 새 세관 IT 시스템이 가동되는 2028년까지 유지됨.", "sources": [{"title": "Euronews — EU to impose €2 fee on all packages entering the bloc as of 1 November (10/30)", "url": "https://www.euronews.com/2026/10/30/eu-to-impose-2-fee-on-all-packages-entering-the-bloc-as-of-1-november"}], "hypothesis": {"products": ["아시아→유럽 특송 샘플·시제품·긴급 부품 (소포·특송 경로)", "애프터마켓·서비스 부품 소량 배송"], "direction": "운영 리스크", "text": "VS 본 물량은 일반 화물로 통관해 직접 영향은 작을 가능성이 높지만, 개발 단계 샘플·시제품이나 라인 정지 대응용 긴급 부품을 특송 소포로 보내는 경우 건당 비용이 늘고, 세관 통제 강화로 통관 대기가 길어질 수 있음. 특히 SOP 직전 샘플 일정이 촉박한 프로젝트에서 리드타임 차질 가능성."}, "caveat": "기사에는 B2B 특송·기업 간 샘플 화물에도 동일하게 적용되는지, 통관 절차가 실제로 얼마나 느려지는지 세부 내용이 없음. VS 화물에 실제 부과되는지는 포워더 확인이 필요함.", "actions": ["특송사·포워더에 11/1 이후 2유로 수수료가 B2B 샘플·긴급 부품 특송에도 적용되는지, 통관 리드타임 변화가 있는지 확인", "11~12월 샘플·시제품 납기가 있는 프로젝트를 정리해 고객과 특송 비용 부담·납기 여유를 사전 협의"], "buyer_question": "With the new EU parcel handling fee and tighter customs checks from 1 November, please let us know if your receiving team sees any delays on express sample or urgent part shipments so we can adjust lead times."}], "today_actions": ["폴란드 헌정 충돌 — 폴란드 공장 고객에게 투자·증설·SOP 일정 영향 확인, 즐로티 환율 노출 점검", "프랑스·유럽 청년 시위 — 프·스·이 고객의 근무·입고 차질 여부와 JIT 납품 시간대 영향 확인, 필요 시 버퍼 재고 협의", "EU 공급국 의존 축소 도구(12월) — OEM·Tier-1의 dual sourcing·원산지 RFQ 계획 문의, 내부 중국산 칩·자석 비중 정리", "피치 프랑스 전망 하향 — 프랑스 OEM에 2027 forecast·EV 프로그램 일정 변화 문의, 프랑스 향 call-off·재고·신용한도 점검", "EU 소포 2유로 수수료 — 특송사에 B2B 샘플·긴급 부품 적용 여부와 통관 리드타임 확인, 11~12월 샘플 일정 사전 협의"]}</script>
<script id="archive-data" type="application/json">["2026-11-01", "2026-10-31", "2026-10-30", "2026-10-29", "2026-10-28", "2026-10-27", "2026-10-26", "2026-10-25", "2026-10-24", "2026-10-23", "2026-10-22", "2026-10-21"]</script>
<script>
const d = JSON.parse(document.getElementById('report-data').textContent);
const archive = JSON.parse(document.getElementById('archive-data').textContent);
const base = '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dirClass = t => /하방|리스크 ?상승|위험/.test(t) && !/운영/.test(t) ? 'd-risk' : /운영/.test(t) ? 'd-ops' : /기회|상방/.test(t) ? 'd-opp' : 'd-mix';
const statusMap = {ok:['수집 완료','s-ok'], partial:['일부 수집','s-part'], blocked:['접근 차단','s-bad'], error:['수집 실패','s-bad']};
const days = ['일','월','화','수','목','금','토'];
const dt = new Date(d.date + 'T00:00:00');
const dateLabel = `${dt.getMonth()+1}월 ${dt.getDate()}일 ${days[dt.getDay()]}요일`;
const key = 'eu-brief-checked-' + d.date;
let checked = [];
try { checked = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}

const topItems = d.items.filter(i => i.section === 'top');
const vsItems = d.items.filter(i => i.section === 'vs');

const issue = it => `
<article class="issue" id="${esc(it.id)}">
  <div class="tags"><span class="tag ${dirClass(it.hypothesis.direction)}">${esc(it.hypothesis.direction)}</span><span class="tag cat">${esc(it.category)}</span></div>
  <h3>${esc(it.title)}</h3>
  <p class="sum">${esc(it.summary)}</p>
  <div class="duo">
    <div class="pane hyp"><h4>VS 제품 영향 가설</h4><p>${esc(it.hypothesis.text)}</p>
      <div class="prods">${it.hypothesis.products.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>
    <div class="pane act"><h4>바이어에게 확인할 것</h4><ul>${it.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
  </div>
  <div class="caveat"><b>미확인</b><span>${esc(it.caveat)}</span></div>
  <div class="ask"><div class="lbl"><span>바이어 질문 예시</span><button class="copy" type="button">복사</button></div><q>${esc(it.buyer_question)}</q></div>
  <details class="src"><summary>출처 ${it.sources.length}건</summary><ul>${it.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul></details>
</article>`;

document.getElementById('app').innerHTML = `
<div class="bar">
  <strong>EU 데일리 브리프 <span>/</span> VS 유럽영업</strong>
  <label>지난 리포트 <select id="arch" aria-label="지난 리포트">${archive.map(a=>`<option value="${base}archive/${a}.html" ${a===d.date?'selected':''}>${a}</option>`).join('')}</select></label>
</div>
<header class="hero">
  <p class="day">${esc(d.date)}</p>
  <h1>${dateLabel}의 유럽</h1>
  <p class="lead">${esc(d.headline)}</p>
</header>
<section class="today" aria-labelledby="today-h">
  <h2 id="today-h">오늘 바이어에게 확인할 것</h2>
  <p class="sub">뉴스는 가설입니다. 판매 추이·재고·발주 데이터로 확인하세요.</p>
  <ul>${d.today_actions.map((t,i)=>`<li><label><input type="checkbox" data-i="${i}" ${checked.includes(i)?'checked':''}><span>${esc(t)}</span></label></li>`).join('')}</ul>
  <div class="count" id="count"></div>
</section>
<section class="overview">
  <div class="sec-h"><h2>오늘의 5가지</h2><p>대형 이슈 ${topItems.length} · VS 연관 ${vsItems.length}</p></div>
  <ol class="ov">${d.items.map(i=>`<li><a href="#${esc(i.id)}"><span class="k ${i.section==='top'?'top':''}">${i.section==='top'?'대형 이슈':'VS 연관'}</span><span class="t">${esc(i.title)}</span></a></li>`).join('')}</ol>
</section>
<section class="group top">
  <div class="sec-h"><h2>오늘의 가장 큰 이슈</h2><p>유럽 전체를 움직인 뉴스</p></div>
  ${topItems.map(issue).join('')}
</section>
<section class="group">
  <div class="sec-h"><h2>VS본부 연관 이슈</h2><p>전장 사업과 직접 닿는 뉴스</p></div>
  ${vsItems.map(issue).join('')}
</section>
<div class="status">${d.sources_status.map(s=>{const [l,c]=statusMap[s.status]||[s.status,''];return `<span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a> <span class="${c}">${esc(l)}</span></span>`}).join('')}</div>
<footer>뉴스 기반 가설이며 수요 변화를 확정하지 않습니다. 생성 ${esc(d.generated_at)}</footer>`;

document.getElementById('arch').addEventListener('change', e => { if (e.target.value) location.href = e.target.value; });
const boxes = [...document.querySelectorAll('.today input')];
const updateCount = () => { const n = boxes.filter(b=>b.checked).length; document.getElementById('count').textContent = `${n} / ${boxes.length} 확인 완료`; };
boxes.forEach(b => b.addEventListener('change', () => {
  const sel = boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
  try { localStorage.setItem(key, JSON.stringify(sel)); } catch(e) {}
  updateCount();
}));
updateCount();
document.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', async () => {
  const text = btn.closest('.ask').querySelector('q').textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = '복사됨'; } catch(e) { btn.textContent = '복사 실패'; }
  setTimeout(() => btn.textContent = '복사', 1600);
}));
</script>
</body>
</html>
