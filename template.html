<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU 데일리 브리프 — __DATE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70; --line:#e4e2dc;
  --accent:#a50034; --hi:#a50034; --mid:#b26a00; --lo:#5d6b78;
  --ok:#2e7d4f; --warn:#b26a00; --bad:#b3261e; --chip:#efede7;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141416;--card:#1d1d20;--ink:#ececee;--muted:#9a9aa1;--line:#2c2c31;
  --accent:#ff5c8a;--hi:#ff5c8a;--mid:#f0a640;--lo:#93a3b3;--ok:#5cc58b;--warn:#f0a640;--bad:#ff6b5e;--chip:#26262b}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 64px}
header .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700;text-transform:uppercase}
h1{font-size:26px;margin:4px 0 6px;line-height:1.3}
.headline{color:var(--muted);margin:0 0 20px}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px;font-size:13px}
.nav select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
section{margin-top:28px}
h2{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.top3 ol{margin:0;padding-left:20px}.top3 li{margin:4px 0}
.actions ul{margin:0;padding-left:0;list-style:none}
.actions li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.actions li:last-child{border-bottom:0}
.actions li::before{content:"☐";color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{white-space:nowrap;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.rel-높음{color:#fff;background:var(--hi)}.rel-중간{color:#fff;background:var(--mid)}.rel-낮음{color:#fff;background:var(--lo)}
.item h3{font-size:17px;margin:2px 0 6px;line-height:1.4}
.item p{margin:0 0 10px}
.lab{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.hyp{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.caveat{font-size:13px;color:var(--warn)}
.item ul{margin:0;padding-left:18px}
.q{font-size:13px;background:var(--chip);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer;flex-shrink:0}
.src a{color:var(--ink);font-size:13px}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.st{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st b{display:block}.st .ok{color:var(--ok)}.st .partial{color:var(--warn)}.st .blocked,.st .error{color:var(--bad)}
footer{margin-top:40px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="report-data" type="application/json">__DATA__</script>
<script id="archive-data" type="application/json">__ARCHIVE__</script>
<script>
const d = JSON.parse(document.getElementById('report-data').textContent);
const archive = JSON.parse(document.getElementById('archive-data').textContent);
const base = '__BASE__';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusLabel = {ok:'수집 완료', partial:'부분 수집', blocked:'접근 차단', error:'오류'};
function render(){
  document.getElementById('app').innerHTML = `
  <header>
    <div class="eyebrow">LG전자 VS · 유럽 해외영업 데일리 브리프</div>
    <h1>${esc(d.date)} 오늘의 유럽</h1>
    <p class="headline">${esc(d.headline)}</p>
  </header>
  <div class="nav">지난 리포트
    <select onchange="if(this.value) location.href=this.value">
      ${archive.map(a => `<option value="${base}archive/${a}.html" ${a===d.date?'selected':''}>${a}</option>`).join('')}
    </select>
  </div>
  <section class="top3"><h2>오늘의 5가지</h2><div class="box"><ol>${d.items.map(i=>`<li><a href="#${esc(i.id)}" style="color:inherit">${esc(i.title)}</a> <span class="chip">${i.section==='top'?'대형 이슈':'VS 연관'}</span></li>`).join('')}</ol></div></section>
  <section class="actions"><h2>오늘 바이어에게 확인할 것</h2><div class="box"><ul>${d.today_actions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></section>
  ${[['top','① 오늘의 가장 큰 이슈'],['vs','② VS본부 연관 이슈']].map(([sec,label]) => `
  <section><h2>${label}</h2>
    ${d.items.filter(i => i.section === sec).map(it => `
    <article class="item" id="${esc(it.id)}">
      <div class="meta"><span class="chip ${sec==='top'?'rel-중간':'rel-높음'}">${sec==='top'?'대형 이슈':'VS 연관'}</span><span class="chip">${esc(it.category)}</span><span class="chip">${esc(it.hypothesis.direction)}</span></div>
      <h3>${esc(it.title)}</h3>
      <p>${esc(it.summary)}</p>
      <div class="lab">VS 제품 수요·유통 영향 가설 ·${it.hypothesis.products.map(esc).join(', ')}</div>
      <div class="hyp">${esc(it.hypothesis.text)}</div>
      <div class="lab">아직 확정 아님</div>
      <div class="caveat">${esc(it.caveat)}</div>
      <div class="lab">확인 행동</div>
      <ul>${it.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
      <div class="lab">바이어 질문 예시</div>
      <div class="q"><span>${esc(it.buyer_question)}</span><button onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent);this.textContent='복사됨'">복사</button></div>
      <div class="lab">출처</div>
      <div class="src">${it.sources.map(s=>`<div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join('')}</div>
    </article>`).join('')}
  </section>`).join('')}
  <section><h2>수집 상태</h2><div class="status">${d.sources_status.map(s=>`
    <div class="st"><b><a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(s.name)}</a></b><span class="${esc(s.status)}">${statusLabel[s.status]||esc(s.status)}</span><div style="color:var(--muted)">${esc(s.note)}</div></div>`).join('')}</div></section>
  <footer>뉴스 기반 가설이며 수요 변화를 확정하지 않습니다. 실제 판단은 바이어 확인과 판매·재고 데이터로 검증하세요. · 생성 ${esc(d.generated_at)}</footer>`;
}
render();
</script>
</body>
</html>
