<script>
const d = JSON.parse(document.getElementById('report-data').textContent);
const archive = JSON.parse(document.getElementById('archive-data').textContent);
const base = '../';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusLabel = {ok:'수집 완료', partial:'부분 수집', blocked:'접근 차단', error:'오류'};
let filter = '전체';

function render(){
  const cats = ['전체', ...new Set(d.items.map(i => i.category))];
  const items = d.items.filter(i => filter === '전체' || i.category === filter);
  document.getElementById('app').innerHTML = `
  <header>
    <div class="eyebrow">LG전자 VS · 유럽 해외영업 데일리 브리프</div>
    <h1>${esc(d.date)} 오늘의 유럽</h1>
    <p class="headline">${esc(d.headline)}</p>
  </header>
  <div class="nav">지난 리포트
    <select onchange="if(this.value) location.href=this.value">
      ${archive.map(a => `<option value="${base}archive/${a}.html" ${a===d.date?'selected':''}>${a}</option>`).join('')}
    </select>
  </div>
  <section class="top3"><h2>핵심 3줄</h2><div class="box"><ol>${d.top3.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div></section>
  <section class="actions"><h2>오늘 바이어에게 확인할 것</h2><div class="box"><ul>${d.today_actions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></section>
  <section><h2>뉴스별 영향 가설</h2>
    <div class="filters">${cats.map(c=>`<button class="${c===filter?'on':''}" onclick="filter='${c}';render()">${esc(c)}</button>`).join('')}</div>
    ${items.map(it => `
    <article class="item">
      <div class="meta"><span class="chip rel-${esc(it.relevance)}">관련도 ${esc(it.relevance)}</span><span class="chip">${esc(it.category)}</span><span class="chip">${esc(it.hypothesis.direction)}</span></div>
      <h3>${esc(it.title)}</h3>
      <p>${esc(it.summary)}</p>
      <div class="lab">VS 제품 영향 가설 · ${it.hypothesis.products.map(esc).join(', ')}</div>
      <div class="hyp">${esc(it.hypothesis.text)}</div>
      <div class="lab">아직 확정 아님</div>
      <div class="caveat">${esc(it.caveat)}</div>
      <div class="lab">확인 행동</div>
      <ul>${it.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
      <div class="lab">바이어 질문 예시</div>
      <div class="q"><span>${esc(it.buyer_question)}</span><button onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent);this.textContent='복사됨'">복사</button></div>
      <div class="lab">출처</div>
      <div class="src">${it.sources.map(s=>`<div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join('')}</div>
    </article>`).join('')}
  </section>
  <section><h2>수집 상태</h2><div class="status">${d.sources_status.map(s=>`
    <div class="st"><b><a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(s.name)}</a></b><span class="${esc(s.status)}">${statusLabel[s.status]||esc(s.status)}</span><div style="color:var(--muted)">${esc(s.note)}</div></div>`).join('')}</div></section>
  <footer>뉴스 기반 가설이며 수요 변화를 확정하지 않습니다. 실제 판단은 바이어 확인과 판매·재고 데이터로 검증하세요. · 생성 ${esc(d.generated_at)}</footer>`;
}
render();
</script>
</body>
</html>
