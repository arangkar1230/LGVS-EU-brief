<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU 데일리 브리프 — 2026-11-04</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --paper:#FBFBF9; --surface:#FFFFFF; --ink:#16213A; --ink-2:#3A4458; --muted:#5A6475; --line:#E4E6EB;
  --wine:#A50034; --wine-ink:#7E0028; --wine-tint:#F6E8ED; --on-wine:#FFFFFF;
  --risk:#B3261E; --risk-bg:#FBEAE8; --ops:#8A5A00; --ops-bg:#FBF1DE; --mix:#3D4F6B; --mix-bg:#E8EDF4; --opp:#1F6B4A; --opp-bg:#E3F2EA;
  --serif:"Noto Serif KR", serif; --sans:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#10141D;--surface:#171C27;--ink:#EEF0F4;--ink-2:#C9CED8;--muted:#98A1B2;--line:#283041;
  --wine:#E0507A;--wine-ink:#F28AA8;--wine-tint:#2A1A22;--on-wine:#FFFFFF;
  --risk:#FF8A80;--risk-bg:#3A1F1E;--ops:#F2C066;--ops-bg:#33290F;--mix:#A9BCD9;--mix-bg:#1F2838;--opp:#7FD6A9;--opp-bg:#15302A}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.bar strong{color:var(--ink);font-weight:600}
.bar strong span{color:var(--wine)}
.bar select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* hero */
.hero{padding:48px 0 36px}
.hero .day{font-size:15px;color:var(--muted);margin:0 0 6px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,48px);line-height:1.2;letter-spacing:-.01em;margin:0 0 22px}
.hero .lead{font-family:var(--serif);font-weight:500;font-size:clamp(19px,3.4vw,22px);line-height:1.7;color:var(--ink-2);margin:0;padding-left:18px;border-left:3px solid var(--wine)}

/* today checklist — the one loud element */
.today{background:var(--wine);color:var(--on-wine);border-radius:18px;padding:28px 28px 22px;margin:8px 0 56px}
.today h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 4px}
.today .sub{font-size:14px;opacity:.85;margin:0 0 16px}
.today ul{list-style:none;margin:0;padding:0}
.today li{border-top:1px solid rgba(255,255,255,.22)}
.today label{display:flex;gap:14px;align-items:flex-start;padding:13px 0;cursor:pointer;font-size:17px;font-weight:500;line-height:1.6}
.today input{appearance:none;flex:none;width:22px;height:22px;margin-top:2px;border:2px solid rgba(255,255,255,.8);border-radius:6px;cursor:pointer;display:grid;place-content:center}
.today input:checked{background:#fff}
.today input:checked::after{content:"";width:10px;height:6px;border:solid var(--wine);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.today input:checked + span{text-decoration:line-through;opacity:.6}
.today .count{font-size:13px;opacity:.85;margin-top:10px}

/* overview */
.overview{margin:0 0 56px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 18px}
.sec-h h2{white-space:nowrap}
.sec-h h2{font-family:var(--serif);font-size:24px;font-weight:700;margin:0}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.ov{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ov li{border-bottom:1px solid var(--line)}
.ov a{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px 0;text-decoration:none;align-items:baseline}
.ov a:hover .t{color:var(--wine)}
.ov .k{font-size:13px;font-weight:600;color:var(--muted)}
.ov .k.top{color:var(--wine)}
.ov .t{font-weight:600;font-size:16.5px;line-height:1.55}

/* issue */
.group{margin:0 0 40px}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 28px;margin:0 0 20px}
.group.top .issue{box-shadow:inset 0 4px 0 var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{font-size:13px;font-weight:600;line-height:1;padding:7px 10px;border-radius:999px;white-space:nowrap;background:var(--mix-bg);color:var(--mix)}
.tag.cat{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.d-risk{background:var(--risk-bg);color:var(--risk)} .d-ops{background:var(--ops-bg);color:var(--ops)}
.d-mix{background:var(--mix-bg);color:var(--mix)} .d-opp{background:var(--opp-bg);color:var(--opp)}
.issue h3{font-family:var(--serif);font-weight:700;font-size:clamp(21px,4vw,25px);line-height:1.45;margin:0 0 12px;letter-spacing:-.005em}
.issue .sum{color:var(--ink-2);margin:0 0 24px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 16px}
.pane{border-radius:12px;padding:18px 18px 16px}
.pane h4{margin:0 0 8px;font-size:14px;font-weight:700}
.hyp{background:var(--mix-bg)} .hyp h4{color:var(--mix)}
.act{background:var(--wine-tint)} .act h4{color:var(--wine-ink)}
.pane p,.pane ul{margin:0;font-size:15.5px;line-height:1.7}
.pane ul{padding-left:18px}.pane li+li{margin-top:6px}
.prods{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 0}
.prods span{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

.caveat{display:flex;gap:10px;font-size:15px;color:var(--ink-2);padding:12px 14px;border:1px dashed var(--line);border-radius:10px;margin:0 0 16px}
.caveat b{flex:none;color:var(--ops);font-weight:700}

.ask{border-left:3px solid var(--wine);padding:4px 0 4px 16px;margin:0 0 18px}
.ask .lbl{font-size:13px;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ask q{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:17px;line-height:1.6;quotes:none}
.copy{font:inherit;font-size:13px;font-weight:600;color:var(--wine-ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer}
.copy:hover{border-color:var(--wine)}

details.src{font-size:14px;color:var(--muted)}
details.src summary{cursor:pointer;width:max-content}
details.src ul{margin:8px 0 0;padding-left:18px}
details.src a{color:var(--ink-2)}

/* status + footer */
.status{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:48px}
.status .s-ok{color:var(--opp)} .status .s-bad{color:var(--risk)} .status .s-part{color:var(--ops)}
footer{font-size:13.5px;color:var(--muted);margin-top:14px;line-height:1.7}

@media (max-width:640px){
  .wrap{padding:0 16px 64px}
  .hero{padding:36px 0 28px}
  .today{padding:22px 20px 16px;border-radius:14px}
  .issue{padding:24px 18px}
  .duo{grid-template-columns:1fr}
  .ov a{grid-template-columns:64px 1fr;gap:10px}
  .sec-h p{flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){
  .today{animation:rise .5s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>

 {"title": "eurotopics — Midterms 2026: what comes next for the US and Europe? (10/15 언론 리뷰)", "url": "https://www.eurotopics.net/en/365639/midterms-2026-what-comes-next-for-the-us-and-europe"}], "hypothesis": {"products": ["미국 수출 비중이 큰 유럽 OEM 차종 (인포테인먼트·ADAS 카메라·ZKW 램프)", "유럽 OEM의 미국 현지 생산 확대 프로그램 (신규 RFQ)", "e-파워트레인 (미국 전기차 정책 방향)"], "direction": "혼재", "text": "관세는 대부분 행정명령으로 운영돼 의회 구도가 바뀌어도 단기간에 크게 달라지지 않을 가능성이 높음. 다만 민주당이 의회를 가져가면 관세·전기차 정책을 둘러싼 견제가 커져, 유럽 OEM이 미국 수출 차종 물량이나 미국 현지화 투자 결정을 '결과를 보고 판단'하며 늦출 수 있음. 반대로 공화당이 의회를 지키면 현 관세 체계와 '대미 투자 대가 관세 완화' 방식이 더 굳어져 미국 현지 생산 이전 압력이 커질 수 있음."}, "caveat": "개표 결과는 아직 확인하지 않았음. 의회 구도가 관세 정책에 미치는 실제 영향은 기사에 분석되지 않았고(통상 언급은 Delo 한 곳뿐), 유럽 OEM의 대응 계획도 알려지지 않았음.", "actions": ["미국 수출 비중이 큰 유럽 OEM 바이어에게 선거 결과에 따라 2027년 미국 수출 차종 forecast를 재검토할 계획이 있는지 확인", "미국 현지 생산을 검토 중인 고객의 소싱 일정(RFQ 시점·현지 조달 요건) 변동 여부를 파악"], "buyer_question": "Depending on the US midterm outcome, do you expect to revisit your 2027 volume forecast for US-bound models or the timing of any US localisation sourcing?"}, {"id": "supermarket-cyberattacks-spread-eu", "section": "top", "category": "사이버보안/공급망", "title": "슈퍼마켓 냉장 설비 사이버공격 최소 11개국으로 확산 — EU '식품 공급망에 대한 의도적 교란', 이탈리아 긴급 회의·벨기에 검찰 수사", "summary": "11/3 기준 냉장·냉동 설비 관제 시스템을 노린 공격이 독일·이탈리아·네덜란드 등 EU 10개국 이상과 영국까지 최소 11개국으로 번졌음. 이탈리아는 약 20개 매장이 피해를 입어 장관들이 정보기관·국가사이버보안청과 긴급 회의를 열었고(정부는 보안이 오래된 매장만 영향을 받았다며 피해가 '매우 제한적'이라고 함), 독일 4곳·루마니아 6곳·시칠리아 쿱 4곳이 피해를 입었으며 스웨덴 쿱은 피해 7개 매장이 정상화됐다고 밝힘. 스웨덴 장비는 구형 4G 이동통신망으로 연결돼 있었음. 벨기에는 연방검찰이 수사에 착수함. 한센 EU 집행위원은 '식품 공급망을 교란하려는 의도적 시도'라고 했고, 루마니아 사이버보안 책임자는 '반(半)아마추어 수준'이라며 국가 배후 가능성은 낮게 봄. 영국 NCSC는 일부 사례에서 취약한 기술이 악용됐다고 함. 공격 주체와 동기는 밝혀지지 않았음. eurotopics에 실린 각국 언론은 하이브리드전의 일부로 보는 시각(스웨덴 Aftonbladet), 공포 확산이 목적인 심리전이지만 더 복잡한 핵심 인프라로 번질 수 있다는 경고(이탈리아 Corriere della Sera), 취약점 점검과 공격 성공 이후까지 대비하라는 주문(아일랜드 Irish Times, 스페인 El Periódico)으로 나뉨.", "sources": [{"title": "Euronews — Italy holds emergency talks as supermarket fridge attacks spread across Europe (11/3)", "url": "https://www.euronews.com/2026/11/03/italy-holds-emergency-talks-as-supermarket-fridge-attacks-spread-across-europe"}, {"title": "eurotopics — Cyberattacks on supermarkets: how should Europe respond? (11/3 언론 리뷰)", "url": "https://www.eurotopics.net/en/366612/cyberattacks-on-supermarkets-how-should-europe-respond"}], "hypothesis": {"products": ["고객 공장·VS 유럽 창고의 원격관리 설비 (OT 보안)", "텔레매틱스 모듈 (이동통신망 기반 원격접속)", "공급사 사이버보안 심사·납품 연속성 요구"], "direction": "운영 리스크", "text": "어제 브리프(텔레매틱스 보안 요건 강화 기회)에 이어, EU가 이를 공급망 교란 시도로 규정하고 대응에 나선 만큼 단기적으로는 운영 측면 리스크가 더 커 보임. 원격 관리용으로 인터넷·이동통신망에 연결된 공장·창고 설비가 같은 방식으로 노려질 수 있고, 고객사가 공급사에 OT 보안 점검이나 사고 시 납품 연속성 계획 제출을 요구할 가능성이 있음. 구형 4G 연결 장비가 악용된 점은 이동통신 기반 텔레매틱스의 원격접속 관리에 대한 질문으로 이어질 수 있음."}, "caveat": "자동차 산업·공장이 공격받았다는 보도는 없음. 공격 수법의 세부 내용과 주체, EU 차원 대응책의 내용(규제·권고 여부)은 아직 나오지 않았음. 고객사가 실제로 공급사 요구사항을 바꿀지는 확인되지 않은 가설임.", "actions": ["VS 유럽 창고·물류 거점의 원격관리 설비(온습도·출입·WMS 연동)가 인터넷·이동통신망에 직접 노출돼 있지 않은지 내부 IT와 즉시 점검", "주요 고객 바이어(구매·보안 담당)에게 이번 사건 이후 공급사 OT 보안 점검이나 납품 연속성(BCP) 자료 요청 계획이 있는지 확인"], "buyer_question": "Following the cyberattacks on connected equipment across Europe, will you be asking suppliers for any additional OT security checks or business-continuity information in the coming weeks?"}, {"id": "schaeffler-europe-restructuring", "section": "vs", "category": "Tier-1/구조조정", "title": "독일 Tier-1 셰플러, 유럽 3,400여 명 감원·5개 사업장 폐쇄 발표 — 내연기관 수요 약화·전기차 전환 지연·중국 경쟁 이유", "summary": "셰플러가 11/3 3분기 실적 발표와 함께 유럽에서 약 3,460명을 줄이고 독일 4곳·벨기에 1곳 등 5개 사업장을 닫는다고 밝힘. 감원의 약 4분의 3이 독일이며 2028년까지 진행해 약 4억8천만 유로를 들여 2030년부터 연 3억 유로를 절감하는 것이 목표임. 회사는 내연기관차 수요 약화와 예상보다 느린 전기차 확산, 중국 업체와의 경쟁 심화, 유럽 다른 지역보다 약 2.5배 높은 독일 인건비를 이유로 들었고, 2024년 구조조정 이후 독일 자동차 산업 여건이 크게 나빠졌다고 진단함. 3분기 실적이 기대에 못 미쳐 주가는 장중 최대 4.5% 떨어졌음.", "sources": [{"title": "Transport Topics(Bloomberg) — VW supplier Schaeffler to cut 3,400 jobs, close 5 sites (11/3) (사실 확인용)", "url": "https://www.ttnews.com/articles/vw-schaeffler-cut-jobs"}], "hypothesis": {"products": ["독일 OEM 내연기관·하이브리드 프로그램 물량 (인포테인먼트·ZKW 램프)", "e-파워트레인 (전기차 전환 속도)", "Tier-1 고객과의 협력·재소싱 기회"], "direction": "혼재", "text": "대형 Tier-1이 '내연기관 약화+전기차 지연'을 동시에 이유로 든 것은 독일 OEM의 중기 생산 계획이 보수적으로 잡히고 있다는 신호일 수 있어, 독일 생산 차종의 forecast·call-off가 하향 조정될 가능성이 있음. e-파워트레인은 전동화 속도가 늦어지면 SOP·램프업이 밀릴 수 있음. 반면 Tier-1이 독일 거점을 줄이며 일부 부품을 외부 조달로 돌리거나 생산지를 옮기면, 재소싱·공동 개발 RFQ가 나올 여지도 있음."}, "caveat": "폐쇄 대상 사업장과 품목, 셰플러가 생산을 어디로 옮길지는 확인되지 않았음. 이 기사는 기본 출처(Euronews·eurotopics)가 아닌 사실 확인용 출처이며, OEM 생산 계획 변경을 직접 보여주는 자료는 아님.", "actions": ["독일 OEM 바이어에게 2027년 내연기관·하이브리드·전기차 차종별 forecast에 최근 하향 조정이 있었는지, 12~1월 call-off 변동 여부 확인", "e-파워트레인 고객에게 전기차 프로그램 SOP·램프업 일정 변경 여부 확인", "Tier-1 고객사 구매 담당에게 생산 거점 재편에 따른 재소싱·신규 RFQ 계획이 있는지 문의"], "buyer_question": "Given the latest restructuring announcements among German suppliers, have there been any recent changes to your 2027 volume forecast or EV programme SOP timing that we should reflect in our planning?"}, {"id": "audi-us-plant-tariff-relief", "section": "vs", "category": "통상/미국 관세", "title": "아우디, 미국 조지아에 첫 공장(약 40억 달러, 연 20만 대) 추진 — 미국은 대미 투자 자동차업체에 관세 완화 약속, EU산 15%→약 10% 거론", "summary": "아우디가 미국 조지아주에 약 40억 달러를 들여 연 20만 대 규모의 SUV 조립 공장을 짓는 방안을 추진 중이며, 내년 착공·2030년대 초 생산 개시 계획이고 폭스바겐 감독이사회 최종 승인이 남아 있음. 아우디는 현재 미국 판매 차량을 모두 유럽·멕시코에서 들여오며, 작년 자동차·철강·알루미늄·부품 관세로 약 12억 유로를 부담함. 미국 정부는 대규모 미국 생산 투자를 하는 자동차업체에 관세를 완화해 주는 프로그램 차원에서 아우디와 협의 중이며, 아우디는 EU산 수입차 관세 15%를 7.5%로 낮추길 원하지만 상무부는 약 10% 수준에서 정할 것으로 전해짐. 세부 내용은 몇 주 안에 나올 수 있고 다른 업체의 대미 투자도 대상이 될 수 있음.", "sources": [{"title": "Kitco(Reuters) — US promises tariff relief in talks with Audi on Georgia plant, sources say (10/29) (사실 확인용)", "url": "https://www.kitco.com/news/off-the-wire/2026-10-29/us-promises-tariff-relief-talks-audi-georgia-plant-sources-say"}], "hypothesis": {"products": ["유럽 생산·미국 수출 SUV 차종 (인포테인먼트·ADAS 카메라·ZKW 램프)", "유럽 OEM 미국 신공장 프로그램 (신규 RFQ, 현지 공급 요건)"], "direction": "혼재", "text": "단기적으로 관세가 15%에서 약 10%로 낮아지면 유럽산 미국 수출 차종의 가격 부담이 줄어 해당 차종 물량이 유지될 수 있음. 중장기적으로는 미국 판매용 SUV 일부가 2030년대 초부터 미국에서 생산되면서 유럽 공장의 해당 차종 물량이 줄 가능성이 있음. 관세 완화가 '대미 투자'와 묶이면 다른 유럽 OEM도 비슷한 투자에 나설 수 있어, 미국 현지 공급 능력을 요구하는 RFQ가 늘어날 수 있음."}, "caveat": "관세율·적용 조건은 아직 확정·발표되지 않았고, 폭스바겐 이사회 승인 전임. 미국 공장 생산 차종과 유럽 공장 물량 이전 규모는 기사에 나오지 않음. Euronews 관련 기사(10/25)는 열리지 않아 사실 확인용 출처로 대신함.", "actions": ["VW그룹(아우디) 바이어에게 미국 공장 계획이 현재 공급 중·수주 예정인 유럽 생산 차종의 수명주기 물량에 영향을 주는지 확인", "다른 유럽 OEM 고객에게 미국 관세 완화 프로그램 참여 검토 여부와 미국 현지 생산용 RFQ 일정·현지 조달 요건 확인"], "buyer_question": "Does the planned US plant change your volume outlook for the Europe-built models we supply, and should we prepare for US-local supply in upcoming RFQs?"}, {"id": "eu-energy-deadlock-germany-storage", "section": "vs", "category": "에너지/생산", "title": "EU 에너지 장관회의 소비자 보호 합의 불발 — 가스 저장률 EU 75%·독일 약 62%, 13개국 가스세 인상안 철회 요구", "summary": "10/29 룩셈부르크 EU 에너지 장관회의는 겨울철 에너지 요금 대응에서 합의를 이루지 못했음. 장관들은 전기 소비세를 가스 소비세보다 높지 않게 하는 방안, 기존 전력망 활용과 국가 간 연계 강화, 공급 다변화를 논의했으나, 독일·이탈리아 등 13개국은 친환경 전환을 위해 가스세를 올리자는 집행위 제안의 철회를 요구함. 10/26 기준 EU 가스 저장률은 약 75%(1년 전 83%)이며 독일은 약 62%, 네덜란드 약 65%, 이탈리아 90% 이상임. 도매 가스 가격은 1월 MWh당 약 28유로에서 10월 말 약 104유로까지 올랐고, 각국은 올해 단기 지원책에 179억 유로를 썼음(연말까지 연장 시 386억 유로). 러시아산 LNG 금지는 2027년 1월 예정대로 추진되며 이사회는 12월 타협을 목표로 함. 요르겐센 집행위원은 약 5천만 명이 집을 제대로 난방하지 못한다고 경고함.", "sources": [{"title": "Euronews — How can the EU support 50 million Europeans who can't heat their homes? (11/3)", "url": "https://www.euronews.com/2026/11/03/how-can-the-eu-support-50-million-europeans-who-cant-heat-their-homes"}, {"title": "Euronews — What's the EU's plan to cut your energy bill? (11/2)", "url": "https://www.euronews.com/2026/11/02/whats-the-eus-plan-to-cut-your-energy-bill-ask-the-euronews-ai-chatbot"}], "hypothesis": {"products": ["독일·네덜란드 OEM·Tier-1 공장 생산 계획 (겨울 에너지 비용)", "ZKW 램프·e-파워트레인 유럽 생산 원가", "소비자 신차 구매 여력 (생활비 부담)"], "direction": "하방 리스크", "text": "EU 차원의 요금 부담 완화책이 12월까지 나오지 않고 독일 가스 저장률이 낮은 상태로 겨울에 들어가면, 독일 고객사가 연말·연초 휴무를 늘리거나 에너지 다소비 공정 가동을 줄일 가능성이 있음. 이는 12~2월 call-off 변동과 재고 조정 요청으로 이어질 수 있음. 가계 에너지 부담이 커지면 신차 구매가 미뤄질 수도 있음. 다만 산업용 대책은 기사에 없고, 날씨와 LNG 도입 상황에 따라 달라질 </section>
<section class="group top">

  ${topItems.map(issue).join('')}
</section>
<section class="group">
  <div class="sec-h"><h2>VS본부 연관 이슈</h2><p>전장 사업과 직접 닿는 뉴스</p></div>
  ${vsItems.map(issue).join('')}

<div class="status">${d.sources_status.map(s=>{const [l,c]=statusMap[s.status]||[s.status,''];return `<span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a> <span class="${c}">${esc(l)}</span></span>`}).join('')}</div>
<footer>뉴스 기반 가설이며 수요 변화를 확정하지 않습니다. 생성 ${esc(d.generated_at)}</footer>`;

document.getElementById('arch').addEventListener('change', e => { if (e.target.value) location.href = e.target.value; });
const boxes = [...document.querySelectorAll('.today input')];
const updateCount = () => { const n = boxes.filter(b=>b.checked).length; document.getElementById('count').textContent = `${n} / ${boxes.length} 확인 완료`; };
boxes.forEach(b => b.addEventListener('change', () => {
  const sel = boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
  try { localStorage.setItem(key, JSON.stringify(sel)); } catch(e) {}
  updateCount();
}));
updateCount();
document.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', async () => {
  const text = btn.closest('.ask').querySelector('q').textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = '복사됨'; } catch(e) { btn.textContent = '복사 실패'; }
  setTimeout(() => btn.textContent = '복사', 1600);
}));
</script>
